name: Privacy contract

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-privacy-contract.mjs
      - run: node scripts/check-large-form-fixture.mjs
      - run: node --check autofill.js && node --check background.js && node --check options.js && node --check popup.js
